problem: >
  Users need to understand what an AI agent can do independently, when
  human approval is required, and whether information represents verified
  data or AI interpretation.

design_decision: >
  Sri designed a five-tier authority/permission framework, human-in-the-loop
  approval boundaries, and a provenance framework distinguishing verified
  information from AI-generated interpretation.

tradeoff: >
  Complete transparency can overwhelm users; too little transparency
  makes consequential AI behavior difficult to evaluate. The design
  therefore explores progressive disclosure.

outcome_qualitative: >
  The framework makes authority and provenance visible interaction
  concepts rather than hidden technical behavior.

